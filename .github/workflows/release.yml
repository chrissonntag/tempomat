name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      pack: false

  build:
    name: Build standalone archives
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Check that the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - run: npm ci
      - run: npm run pack:tarballs
      - name: Write checksums
        working-directory: dist
        run: sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archives
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archives
          path: dist/
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[?" version "\\]?" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no section for $version"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS install/install.sh install/install.ps1 \
            --title "tempomat ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag

  verify:
    name: Install release (${{ matrix.os }})
    needs: publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TEMPOMAT_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          sh install/install.sh
          version=$("$HOME/.local/bin/tempo" --version)
          echo "$version"
          echo "$version" | grep -q "^tempomat/${GITHUB_REF_NAME#v} "
          "$HOME/.local/bin/tempo" skill:install --dir "$RUNNER_TEMP/skills"
          grep -q "Installed by tempomat ${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/skills/tempo/SKILL.md"
          "$HOME/.local/bin/tempo" update --check
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install/install.ps1
          $tempo = Join-Path $env:LOCALAPPDATA 'tempomat\bin\tempo.cmd'
          $version = & $tempo --version
          Write-Host $version
          if ($version -notlike "tempomat/$($env:GITHUB_REF_NAME -replace '^v', '') *") { throw "unexpected version $version" }
          & $tempo skill:install --dir "$env:RUNNER_TEMP\skills"
          if (-not (Select-String -Quiet -Path "$env:RUNNER_TEMP\skills\tempo\SKILL.md" -Pattern 'Installed by tempomat')) { throw 'skill not installed' }
          & $tempo update --check
